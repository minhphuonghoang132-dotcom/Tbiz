:root[data-theme="dark"]{

.stat-row>div+div{border-left:1px solid var(--line)}

.stat-num{font-family:var(--f-display);font-weight:600;font-size:clamp(44px,5.6vw,64px);line-height:1;letter-spacing:-.03em;color:var(--pine)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px}
.panel-forest{background:var(--forest);color:var(--on-forest);border-radius:20px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:6px}
.chip-crit{background:var(--crit-soft);color:var(--crit)}
.icon-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--leaf-soft);color:var(--pine)}
.step-dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;background:var(--ground);border:2px solid var(--leaf);color:var(--pine)}

.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav-h) - 1px);z-index:40;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--pine);flex-shrink:0;font-weight:400}
.faq[open] summary::after{content:"\2013"}
.faq p{padding-bottom:22px;color:var(--ink-2);max-width:72ch}


/* ===== motion ===== */
.rv{opacity:0;transform:translateY(20px);transition:opacity .75s cubic-bezier(.22,.7,.2,1),transform .75s cubic-bezier(.22,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@keyframes pa-rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pa-draw{to{stroke-dashoffset:0}}
@keyframes pa-ping{0%{transform:scale(.65);opacity:.8}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}
@keyframes pa-kb{from{transform:scale(1.05)}to{transform:scale(1.15) translate3d(-1.4%,-1.2%,0)}}
@keyframes pa-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.frame{animation:pa-rise .85s .1s cubic-bezier(.22,.7,.2,1) both}
.hero-stack>*{animation:pa-rise .8s both cubic-bezier(.22,.7,.2,1)}
.hero-stack>*:nth-child(1){animation-delay:.04s}
.hero-stack>*:nth-child(2){animation-delay:.13s}
.hero-stack>*:nth-child(3){animation-delay:.22s}
.hero-stack>*:nth-child(4){animation-delay:.31s}
.draw{stroke-dasharray:640;stroke-dashoffset:640;animation:pa-draw 1.5s .2s cubic-bezier(.4,0,.2,1) forwards}
.draw2{animation-delay:.6s}
.live-dot{animation:pa-pulse 2s ease-in-out infinite}
.lift{transition:transform .38s cubic-bezier(.22,.7,.2,1),box-shadow .38s,border-color .38s}
.lift:hover{transform:translateY(-5px);box-shadow:0 22px 46px -26px rgba(12,59,44,.55);border-color:color-mix(in srgb,var(--pine) 50%,var(--line))}
.icon-tile{transition:transform .38s cubic-bezier(.22,.7,.2,1)}
.lift:hover .icon-tile{transform:scale(1.09) rotate(-5deg)}
.nav-prog{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--pine),var(--leaf));transition:width .1s linear;border-radius:0 2px 2px 0}
.subnav button{transition:background .2s,color .2s}
.subnav button.on{background:var(--forest);color:var(--on-forest)}

/* ===== photo band ===== */
.photo{position:relative;overflow:hidden;color:#fff;background:var(--forest)}
.photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:54% 62%;animation:pa-kb 28s ease-in-out infinite alternate}
.photo-shade{position:absolute;inset:0;background:linear-gradient(98deg,rgba(7,31,23,.95) 0%,rgba(7,31,23,.86) 30%,rgba(7,31,23,.52) 58%,rgba(7,31,23,.16) 100%)}
@media(max-width:900px){.photo-shade{background:linear-gradient(180deg,rgba(7,31,23,.72) 0%,rgba(7,31,23,.9) 48%,rgba(7,31,23,.95) 100%)}.photo-img{object-position:62% 58%}}
.hot{position:absolute;display:flex;align-items:center;gap:11px;z-index:2}
.hot-dot{position:relative;width:13px;height:13px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 3px rgba(116,191,77,.3);flex:none}
.hot-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--leaf);animation:pa-ping 2.8s cubic-bezier(0,0,.2,1) infinite}
.hot-label{font-family:var(--f-display);font-size:13px;font-weight:600;background:rgba(7,31,23,.74);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.24);padding:5px 12px;border-radius:999px;white-space:nowrap}

@media(prefers-reduced-motion:reduce){
.rv{opacity:1;transform:none;transition:none}
.frame,.hero-stack>*,.photo-img,.live-dot,.hot-dot::after{animation:none}
.draw{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.lift:hover{transform:none}}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fade{animation:none}}
</style>
</head>

const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
function Reveal({children,d=0,c='',style}){const r=useRef();const[v,set]=useState(RM);
useEffect(()=>{if(RM)return;let o;const t=setTimeout(()=>set(true),2200);
try{o=new IntersectionObserver(([e])=>{if(e.isIntersecting){set(true);o.disconnect()}},{threshold:.08,rootMargin:'0px 0px -40px 0px'});o.observe(r.current)}catch(e){set(true)}
return()=>{o&&o.disconnect();clearTimeout(t)}},[]);
return <div ref={r} className={`rv ${v?'in':''} ${c}`} style={{...style,transitionDelay:d+'ms'}}>{children}</div>}
function Count({to,fmt}){const r=useRef();const[n,set]=useState(RM?to:0);
useEffect(()=>{if(RM)return;let o,raf,done=false;const run=()=>{if(done)return;done=true;const t0=performance.now();const step=t=>{const q=Math.min((t-t0)/1300,1);set(Math.round(to*(1-Math.pow(1-q,3))));if(q<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const fb=setTimeout(()=>{if(!done){done=true;set(to)}},2400);
try{o=new IntersectionObserver(([e])=>{if(e.isIntersecting){run();o.disconnect()}},{threshold:.35});o.observe(r.current)}catch(e){set(to)}
return()=>{o&&o.disconnect();clearTimeout(fb);cancelAnimationFrame(raf)}},[to]);
return <span ref={r}>{fmt?fmt(n):n}</span>}
function useScrollPos(f){useEffect(()=>{if(RM)return;let raf;const h=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(f)};addEventListener('scroll',h,{passive:true});h();return()=>{removeEventListener('scroll',h);cancelAnimationFrame(raf)}},[])}
const Head=({t,s,pill,pk,dark,c=''})=><Reveal c={`max-w-3xl ${c}`}>{pill&&<div className="mb-4"><Pill k={pk||(dark?'pill-dark':'')}>{pill}</Pill></div>}<h2 className="t-h2">{t}</h2>{s&&<p className={`t-lead mt-4 ${dark?'on-f2':'mut'}`}>{s}</p>}</Reveal>;

/* ===== Dust drifting downwind (hero) ===== */
function DustField(){const r=useRef();useEffect(()=>{const c=r.current,x=c.getContext('2d');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let w,h,id,ps=[],dpr=Math.min(devicePixelRatio||1,2);
const mk=()=>({x:Math.random()*w*0.5,y:h*(0.45+Math.random()*0.55),r:Math.random()*2+0.4,vx:Math.random()*0.45+0.15,vy:-(Math.random()*0.12+0.02),a:Math.random()*0.32+0.1,life:0});
const rs=()=>{w=c.offsetWidth;h=c.offsetHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);ps=Array.from({length:Math.min(80,w/14|0)},()=>{const p=mk();p.x=Math.random()*w;return p})};rs();addEventListener('resize',rs);
const t=()=>{x.clearRect(0,0,w,h);ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy+Math.sin((p.x+i*40)/90)*0.15;p.life++;if(p.x>w+10||p.y<-10){ps[i]=mk()}const fade=Math.min(1,p.life/80);x.fillStyle=`rgba(214,170,110,${p.a*fade})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});id=requestAnimationFrame(t)};t();
return()=>{cancelAnimationFrame(id);removeEventListener('resize',rs)}},[]);
return <canvas ref={r} aria-hidden="true"/>}

/* ===== Risk forecast (canonical: tomorrow 08:00-11:00, 71% to 11%) ===== */
const RISK_NOW=[[0,9],[3,8],[6,14],[7,29],[8,52],[9,68],[9.5,71],[10,65],[11,44],[12,27],[14,20],[16,17],[18,13],[21,10],[24,9]];
const RISK_PLAN=[[0,8],[3,7],[6,9],[8,10],[9.5,11],[11,9],[12,8],[14,11],[16,9],[18,8],[21,7],[24,7]];
function smooth(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function RiskChart(){const X0=36,X1=296,Y0=112,Y1=16;const sx=h=>X0+(X1-X0)*h/24,sy=v=>Y0-(Y0-Y1)*v/100;
const now=RISK_NOW.map(([a,b])=>[sx(a),sy(b)]),plan=RISK_PLAN.map(([a,b])=>[sx(a),sy(b)]);

{[[0,'00:00'],[6,'06:00'],[12,'12:00'],[18,'18:00'],[24,'24:00']].map(([t,l])=><text key={t} x={sx(t)} y={Y0+16} fontSize="10" textAnchor="middle" fill="var(--ink-2)">{l}</text>)}
<path className="draw" d={smooth(now)} fill="none" stroke="var(--dust)" strokeWidth="2.4" strokeLinecap="round"/>
<path className="draw draw2" d={smooth(plan)} fill="none" stroke="var(--pine)" strokeWidth="2.4" strokeLinecap="round"/>
<circle cx={sx(9.5)} cy={sy(71)} r="3.6" fill="var(--dust)"/><text x={sx(9.5)+7} y={sy(71)+4} fontSize="11" fontWeight="600" fill="var(--dust-ink)">71%</text>

<div className="panel p-6"><div className="flex items-center gap-2 t-sm mut"><I n="pin" s={16}/>Location</div><div className="font-semibold mt-1.5">{CONTACT.location}</div></div>
</aside></Wrap></section></>}

/* ===== Layout ===== */
function Nav({page}){const[o,setO]=useState(false);const[pr,setPr]=useState(0);
useScrollPos(()=>{const h=document.documentElement;const m=h.scrollHeight-h.clientHeight;setPr(m>8?Math.min(100,h.scrollTop/m*100):0)});
return <header className="nav"><span className="nav-prog" style={{width:pr+'%'}}/><Wrap c="flex items-center justify-between"><div style={{height:'var(--nav-h)'}} className="flex items-center"><A to="home" aria-label="PreventAir AI home"><Brand size={34}/></A></div>
<nav className="hidden md:flex items-center gap-8" aria-label="Main">{PAGES.map(([k,l])=><A key={k} to={k} className="nav-link" aria-current={page===k?'page':undefined}>{l}</A>)}<A to="contact" className="btn btn-pine !py-2.5 !px-4 !text-[15px]">Book a walkthrough</A></nav>
<button type="button" className="md:hidden p-2 -mr-2" aria-label={o?'Close menu':'Open menu'} aria-expanded={o} onClick={()=>setO(!o)}><I n={o?'x':'menu'} s={26}/></button></Wrap>
{o&&<nav className="md:hidden border-t line" aria-label="Mobile"><Wrap c="pb-5">{PAGES.map(([k,l])=><A key={k} to={k} onClick={()=>setO(false)} aria-current={page===k?'page':undefined} className="block py-3.5 border-b line font-medium" style={{fontFamily:'var(--f-display)'}}>{l}</A>)}<A to="contact" onClick={()=>setO(false)} className="btn btn-pine w-full mt-4">Book a walkthrough</A></Wrap></nav>}</header>}

function Footer(){return <footer className="sec-forest" style={{borderTop:'1px solid var(--forest-line)'}}><Wrap c="py-14">
<div className="grid gap-10 md:grid-cols-[1.4fr_1fr_1fr]">
<div><Brand onDark size={38}/><p className="mt-4 font-medium" style={{fontFamily:'var(--f-display)',color:'var(--leaf)'}}>AI for a safer construction site</p><p className="t-sm on-f2 mt-2 max-w-sm">Dust-risk intelligence for cleaner construction in Hanoi. A university project concept, not yet commercially deployed.</p></div>
<nav aria-label="Footer" className="grid gap-2.5 content-start">{PAGES.map(([k,l])=><A key={k} to={k} className="on-f2 hover:text-white">{l}</A>)}</nav>
<div className="grid gap-3 content-start t-sm"><a href={HREF.email} className="on-f2 hover:text-white break-all">{CONTACT.email}</a>
<div className="flex gap-2.5 mt-1">{[['linkedin','LinkedIn',HREF.linkedin],['facebook','Facebook',HREF.facebook],['mail','Email',HREF.email]].map(([ic,l,h])=><a key={l} href={h} target={h.startsWith('http')?'_blank':undefined} rel="noopener" aria-label={`PreventAir AI on ${l}`} title={l} className="w-10 h-10 rounded-full grid place-items-center transition-colors hover:bg-[color:var(--forest-2)]" style={{border:'1px solid var(--forest-line)'}}><I n={ic} s={17}/></a>)}</div></div></div>
<p className="mt-12 pt-6 t-xs on-f2 border-t" style={{borderColor:'var(--forest-line)'}}>© 2026 PreventAir AI. All rights reserved.</p></Wrap></footer>}

function App(){
const[page,setPage]=useState(readHash());
useEffect(()=>{navigate=to=>{setPage(to);try{history.pushState(null,'','#/'+to)}catch(e){}window.scrollTo({top:0})};
const f=()=>{setPage(readHash());window.scrollTo({top:0})};addEventListener('hashchange',f);addEventListener('popstate',f);return()=>{removeEventListener('hashchange',f);removeEventListener('popstate',f)}},[]);
useEffect(()=>{document.title=page==='home'?'PreventAir AI':`${PAGES.find(p=>p[0]===page)[1]} · PreventAir AI`},[page]);
const P={home:Home,about:About,solution:Solution,contact:Contact}[page];
return <><a href="#main" onClick={e=>{e.preventDefault();document.getElementById('main').focus()}} className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] focus:bg-white focus:text-black focus:p-3 focus:rounded">Skip to content</a>
<Nav page={page}/><main id="main" tabIndex="-1" key={page} className="fade outline-none"><P/></main><Footer/></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
